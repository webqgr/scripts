                                                        <span class="text-slate-500">${ex.base}</span>
                                                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                                        ${ex.step ? `<span class="text-amber-600 text-[10px] md:text-xs font-bold">${ex.step}</span> <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>` : ''}
                                                        <span class="text-slate-900 font-bold underline decoration-indigo-400 decoration-2">${ex.result}</span>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Notes/Attentions inside the column (Tighter & Compact) -->
                                    <div class="mt-2 space-y-1.5">
                                        ${section.note ? `
                                            <div class="bg-slate-100/80 border-l-2 border-slate-400 p-2 rounded text-xs text-slate-600 leading-normal">
                                                <strong class="text-slate-700 text-[10px] uppercase block tracking-wider mb-0.5">Σημείωση</strong>
                                                ${section.note}
                                            </div>
                                        ` : ''}

                                        ${section.warning ? `
                                            <div class="bg-amber-50 border-l-2 border-amber-400 p-2.5 rounded text-xs md:text-sm text-slate-700 leading-normal">
                                                <strong class="text-amber-700 text-[10px] uppercase block tracking-wider mb-0.5">Προσοχή</strong>
                                                ${section.warning}
                                            </div>
                                        ` : ''}
                                    </div>
                                    
                                </div>
                            `).join('')}
                        </div>

                        <!-- Footer slide rules (Aorist / Perfect extra rules) -->
                        ${slide.footerNotes ? `
                            <div class="mt-4 bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex flex-col md:flex-row md:items-center justify-center gap-2 md:gap-4 text-xs md:text-sm text-slate-600 font-semibold max-w-5xl mx-auto w-full shadow-sm">
                                ${slide.footerNotes.map(note => `
                                    <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-md border border-slate-200 shadow-xs">
                                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span>${note}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                    </div>
                `;
            }
        }

        // Render active slide with quick transitions
        function renderActiveSlide() {
            const activeSlide = slidesData.find(s => s.id === currentSlideIndex);
            const container = document.getElementById('slide-container');
            
            // Fade out, switch content, fade in smoothly
            container.style.opacity = '0';
            container.style.transform = 'translateY(4px)';
            
            setTimeout(() => {
                container.innerHTML = renderSlideHTML(activeSlide);
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
                
                // Update navigation and tab buttons
                updateControls();
            }, 120);
        }

        // Update states for tabs, buttons, and visual pagination dots
        function updateControls() {
            // Update Horizontal Tab Buttons
            for (let i = 1; i <= 5; i++) {
                const thumb = document.getElementById(`thumb-${i}`);
                if (thumb) {
                    if (i === currentSlideIndex) {
                        thumb.className = "flex-1 min-w-[100px] py-3.5 px-3 text-center text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/40 transition-all rounded-t-lg";
                    } else {
                        thumb.className = "flex-1 min-w-[100px] py-3.5 px-3 text-center text-xs font-medium border-b border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100/60 transition-all rounded-t-lg";
                    }
                }
            }

            // Update Pagination Arrow State
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            if (prevBtn) prevBtn.disabled = (currentSlideIndex === 1);
            if (nextBtn) nextBtn.disabled = (currentSlideIndex === 5);

            // Redraw navigation dots
            const dotsContainer = document.getElementById('nav-dots');
            if (dotsContainer) {
                dotsContainer.innerHTML = slidesData.map(slide => `
                    <button onclick="goToSlide(${slide.id})" 
                            class="w-2.5 h-2.5 rounded-full transition-all duration-300 ${slide.id === currentSlideIndex ? 'bg-indigo-600 w-5' : 'bg-slate-200 hover:bg-slate-300'}"
                            title="Διαφάνεια ${slide.id}">
                    </button>
                `).join('');
            }
        }

        // Interactive Slide Navigation Handlers
        function prevSlide() {
            if (currentSlideIndex > 1) {
                currentSlideIndex--;
                renderActiveSlide();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length) {
                currentSlideIndex++;
                renderActiveSlide();
            }
        }

        function goToSlide(num) {
            if (num >= 1 && num <= slidesData.length) {
                currentSlideIndex = num;
                renderActiveSlide();
            }
        }

        // Toggle Fullscreen Mode
        function toggleFullscreen() {
            const viewport = document.getElementById('presentation-viewport');
            const icon = document.getElementById('fullscreen-icon');
            
            if (!document.fullscreenElement) {
                viewport.requestFullscreen().catch(err => {
                    console.log("Error going fullscreen: ", err);
                });
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`; // Change to Close icon
            } else {
                document.exitFullscreen();
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>`;
            }
        }

        // Key Listener for Slides Navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === "ArrowLeft") {
                prevSlide();
            } else if (event.key === "ArrowRight") {
                nextSlide();
            }
        });

        // Initialize App on load
        window.onload = function() {
            renderActiveSlide();
        };
    </script>
</body>
</html>
